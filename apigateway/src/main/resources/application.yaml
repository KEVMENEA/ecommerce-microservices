server:
  port: 8080

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.meneakevit.store/realms/ecommerce
  config:
    import: "optional:configserver:http://localhost:8888"

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/v1/products/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**

            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                  - Path=/api/v1/inventories/**

            - id: warehouse-service-route
              uri: lb://inventory-service
              predicates:
                  - Path=/api/v1/warehouses/**
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/



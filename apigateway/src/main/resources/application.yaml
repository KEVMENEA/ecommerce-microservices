server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service
              uri: http://product-service:8082
              predicates:
                - Path=/api/v1/products/**

            - id: user-service
              uri: http://user-service:8081
              predicates:
                - Path=/api/v1/users/**

eureka:
  client:
    enabled: false
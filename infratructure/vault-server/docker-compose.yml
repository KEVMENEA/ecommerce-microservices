services:
  vault:
    image: hashicorp/vault:latest
    container_name: vault

    ports:
      - "8200:8200"

#    still on ram
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=myroot
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200


#    security that who can not modify on disk
    cap_add:
      - IPC_LOCK

    command: vault server -dev
    networks:
      - vault-net
networks:
  vault-net:
    external: true
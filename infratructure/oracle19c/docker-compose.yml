services:
  cdc-oracle:
    image: container-registry.oracle.com/database/enterprise:19.3.0.0
    container_name: cdc-oracle19c

    ports:
      - "1521:1521"

    environment:
      ORACLE_PWD: Oracle@168
      ENABLE_ARCHIVELOG: true

    volumes:
      - ./init-scripts:/opt/oracle/scripts/startup
      - oracle_data_cdc:/opt/oracle/oradata

    networks:
      - rtr-net

volumes:
  oracle_data_cdc:

networks:
  rtr-net:
    external: true